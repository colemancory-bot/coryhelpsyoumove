<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FRXENGTEZF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-FRXENGTEZF');</script>
<title>Leave a Review | Cory Coleman Real Estate</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://coryhelpsyoumove.com/review.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0B09;--gold:#C4B08C;--cream:#F5F0E8;--text-body:rgba(245,240,232,0.75);--text-muted:rgba(245,240,232,0.4);--border:rgba(196,176,140,0.15);--surface:#1A1815;--green:#4CAF50}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--cream);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem}
.rv-container{max-width:560px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2.5rem;position:relative}
.rv-logo{text-align:center;margin-bottom:2rem}
.rv-logo-name{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--cream);font-weight:300}
.rv-logo-sub{font-size:0.6rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-top:0.2rem}
.rv-greeting{text-align:center;margin-bottom:2rem}
.rv-greeting h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--cream);margin-bottom:0.5rem}
.rv-greeting p{font-size:0.85rem;color:var(--text-body);line-height:1.6}
.rv-greeting .rv-addr{color:var(--gold);font-weight:500}

/* Stars */
.rv-stars{display:flex;justify-content:center;gap:0.5rem;margin:1.5rem 0}
.rv-star{width:48px;height:48px;cursor:pointer;fill:var(--border);transition:all 0.2s;stroke:none}
.rv-star.active{fill:var(--gold)}
.rv-star:hover{transform:scale(1.15)}

/* Form fields */
.rv-field{margin-bottom:1.25rem}
.rv-label{font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem;display:block}
.rv-textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--cream);font-family:'Outfit',sans-serif;font-size:0.9rem;padding:0.9rem 1rem;border-radius:6px;outline:none;transition:border-color 0.3s;resize:vertical;min-height:180px;line-height:1.6}
.rv-textarea:focus{border-color:var(--gold)}
.rv-charcount{font-size:0.65rem;color:var(--text-muted);text-align:right;margin-top:0.3rem}
.rv-helper{font-size:0.75rem;color:var(--text-body);line-height:1.55;margin-top:0.75rem}

/* Buttons */
.rv-btn{display:block;width:100%;padding:0.9rem;border:none;border-radius:6px;font-family:'Outfit',sans-serif;font-size:0.75rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:all 0.3s;margin-top:1rem}
.rv-btn-primary{background:var(--gold);color:var(--bg)}
.rv-btn-primary:hover{background:#d4c49c}
.rv-btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.rv-btn-secondary{background:transparent;border:1px solid var(--border);color:var(--cream)}
.rv-btn-secondary:hover{border-color:var(--gold);color:var(--gold)}

/* Thank you / share */
.rv-thankyou{text-align:center}
.rv-thankyou h2{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--cream);margin-bottom:0.75rem}
.rv-thankyou p{font-size:0.85rem;color:var(--text-body);margin-bottom:1.5rem;line-height:1.6}
.rv-copy-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:1rem;margin:1rem 0;text-align:left;font-size:0.85rem;color:var(--cream);line-height:1.6;max-height:200px;overflow-y:auto;white-space:pre-wrap}
.rv-copy-btn{display:flex;align-items:center;justify-content:center;gap:0.4rem;width:100%;padding:0.75rem;background:var(--surface);border:1px solid var(--gold);color:var(--gold);border-radius:6px;font-family:'Outfit',sans-serif;font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;margin:0.75rem 0;transition:all 0.3s}
.rv-copy-btn:hover{background:var(--gold);color:var(--bg)}
.rv-copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}

.rv-share-label{font-size:0.6rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin:1.5rem 0 0.75rem;text-align:center}
.rv-share-btns{display:flex;flex-direction:column;gap:0.5rem}
.rv-share-btn{display:flex;align-items:center;gap:0.75rem;padding:0.85rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--cream);font-family:'Outfit',sans-serif;font-size:0.8rem;cursor:pointer;text-decoration:none;transition:all 0.3s}
.rv-share-btn:hover{border-color:var(--gold);color:var(--gold)}
.rv-share-btn svg{width:20px;height:20px;flex-shrink:0}
.rv-share-btn span{flex:1}
.rv-share-btn .rv-arrow{color:var(--text-muted);font-size:0.7rem}
.rv-toast{position:fixed;top:1.5rem;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:0.75rem 1.5rem;border-radius:8px;font-size:0.8rem;font-family:'Outfit',sans-serif;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.rv-toast.show{opacity:1}
.rv-share-help{font-size:0.75rem;color:var(--text-body);line-height:1.5;margin-bottom:0.75rem;text-align:center}

/* Loading/error */
.rv-loading{text-align:center;padding:3rem;color:var(--text-muted)}
.rv-error{text-align:center;padding:3rem;color:#e57373}

/* Footer */
.rv-footer{text-align:center;margin-top:2rem;font-size:0.6rem;color:var(--text-muted);letter-spacing:0.1em}

@media(max-width:600px){
  body{padding:1rem}
  .rv-container{padding:1.5rem}
  .rv-star{width:40px;height:40px}
  .rv-greeting h1{font-size:1.4rem}
}
</style>
</head>
<body>

<div class="rv-container" id="rvContainer">
  <div class="rv-loading" id="rvLoading">Loading...</div>
</div>

<div class="rv-footer">Equal Housing Opportunity | Cory Coleman, Keller Williams Great Smokies</div>

<script>
var SUPABASE_URL = 'https://kzaabnnwjupjqvydiqlz.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6YWFibm53anVwanF2eWRpcWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExMTE5NDMsImV4cCI6MjA4NjY4Nzk0M30.2B2sJnAuDim_yhn5UFKxXzdZw58ne4E20-ulW8pTwPA';

// Public review page links (shown to every reviewer regardless of rating)
var GOOGLE_REVIEW_URL = 'https://search.google.com/local/writereview?placeid=ChIJiyLzaaxi6A0RaBEQSTh2okM';
var FACEBOOK_REVIEW_URL = 'https://www.facebook.com/profile.php?id=61561909577942&sk=reviews';
var ZILLOW_REVIEW_URL = 'https://www.zillow.com/reviews/write/?s=X1-ZUq3l7tko90oi1_2599o';

var _token = new URLSearchParams(window.location.search).get('token');
var _requestData = null;
var _selectedRating = 0;
var _reviewText = '';

var container = document.getElementById('rvContainer');

function starSVG(){ return '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'; }

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function rvFetch(body){
  var resp = await fetch(SUPABASE_URL + '/functions/v1/review-request', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY},
    body:JSON.stringify(body)
  });
  return resp.json();
}

async function init(){
  if(!_token){ showError('Invalid review link.'); return; }
  try {
    var data = await rvFetch({action:'load',token:_token});
    if(!data.ok){ showError(data.error || 'This review link is no longer valid.'); return; }
    _requestData = data;
    if(data.alreadySubmitted){ _reviewText = data.reviewText || ''; showThankYou(); return; }
    showStep1();
  } catch(e){ showError('Unable to load. Please try again later.'); }
}

function showError(msg){
  container.innerHTML = '<div class="rv-error">'+escapeHtml(msg)+'</div>';
}

// Step 1: star rating
function showStep1(){
  var addrHtml = _requestData.propertyAddress ? '<span class="rv-addr">'+escapeHtml(_requestData.propertyAddress)+'</span>' : 'your property';
  var nameLine = _requestData.clientName ? escapeHtml(_requestData.clientName)+', thank' : 'Thank';
  container.innerHTML =
    '<div class="rv-logo"><div class="rv-logo-name">Cory Coleman</div><div class="rv-logo-sub">Keller Williams Great Smokies</div></div>' +
    '<div class="rv-greeting"><h1>How was your experience?</h1><p>'+nameLine+' you for choosing me to help with '+addrHtml+'. Your honest feedback means a lot.</p></div>' +
    '<div class="rv-stars" id="rvStars"></div>' +
    '<button class="rv-btn rv-btn-primary" id="rvNextBtn" disabled onclick="showStep2()">Continue</button>';

  var starsEl = document.getElementById('rvStars');
  for(var i=1;i<=5;i++){
    var s = document.createElement('div');
    s.className = 'rv-star';
    s.innerHTML = starSVG();
    s.setAttribute('data-val', i);
    s.onclick = function(){ selectRating(parseInt(this.getAttribute('data-val'))); };
    starsEl.appendChild(s);
  }
}

function selectRating(val){
  _selectedRating = val;
  document.querySelectorAll('.rv-star').forEach(function(s,i){
    s.classList.toggle('active', i < val);
  });
  document.getElementById('rvNextBtn').disabled = false;
}

// Step 2: write a review (same screen for every rating)
function showStep2(){
  container.innerHTML =
    '<div class="rv-logo"><div class="rv-logo-name">Cory Coleman</div><div class="rv-logo-sub">Keller Williams Great Smokies</div></div>' +
    '<div class="rv-greeting"><h1>Tell us about your experience</h1><p>Write in your own words. Honest feedback, positive or negative, is what\'s helpful.</p></div>' +
    '<div class="rv-field">' +
      '<textarea class="rv-textarea" id="rvReviewText" rows="7" maxlength="2000" placeholder="Share your experience..."></textarea>' +
      '<div class="rv-charcount"><span id="rvCharCount">0</span> / 2,000</div>' +
      '<p class="rv-helper">Reviews tend to be most useful when they describe what actually happened. The area you worked in, what the process was like, or specific details from the transaction are all worth mentioning. Write whatever feels right.</p>' +
    '</div>' +
    '<button class="rv-btn rv-btn-primary" id="rvSubmitBtn" onclick="submitReview()" disabled>Submit Review</button>';

  var ta = document.getElementById('rvReviewText');
  var cc = document.getElementById('rvCharCount');
  var btn = document.getElementById('rvSubmitBtn');
  ta.addEventListener('input', function(){
    cc.textContent = ta.value.length;
    btn.disabled = ta.value.trim().length < 10;
  });
  ta.focus();
}

async function submitReview(){
  var btn = document.getElementById('rvSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting...';

  var reviewText = document.getElementById('rvReviewText').value.trim();
  _reviewText = reviewText;

  try {
    var data = await rvFetch({
      action:'submit', token:_token, rating:_selectedRating, reviewText:reviewText,
      town: _requestData.town || '', propertyType: '', buyOrSell: ''
    });
    if(!data.ok){ btn.disabled=false; btn.textContent='Submit Review'; alert(data.error||'Error submitting. Please try again.'); return; }
    showThankYou();
  } catch(e){ btn.disabled=false; btn.textContent='Submit Review'; alert('Error submitting. Please try again.'); }
}

// Step 3: thank you (same screen for every rating). Public review links shown to all.
function showThankYou(){
  container.innerHTML =
    '<div class="rv-thankyou">' +
      '<div class="rv-logo"><div class="rv-logo-name">Cory Coleman</div><div class="rv-logo-sub">Keller Williams Great Smokies</div></div>' +
      '<h2>Thank you</h2>' +
      '<p>Your review has been sent to Cory. It will appear on the website after a quick review.</p>' +
      '<div style="background:var(--bg);border:1px solid var(--gold);border-radius:10px;padding:1.25rem;margin-top:1.5rem">' +
        '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.15rem;color:var(--cream);text-align:center;margin-bottom:0.5rem">Want to share elsewhere?</div>' +
        '<p class="rv-share-help">If you\'d like to also post on any of these sites, here are the links. Your text is below for reference. You can copy it and paste it, or write something different, whichever you prefer.</p>' +
        '<div class="rv-copy-box" id="rvCopyText">'+escapeHtml(_reviewText)+'</div>' +
        '<button class="rv-copy-btn" id="rvCopyBtn" onclick="copyReview()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy my review</button>' +
        '<div class="rv-share-btns" style="margin-top:0.5rem">' +
          '<a class="rv-share-btn" href="'+GOOGLE_REVIEW_URL+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#4285F4"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg><span>Google</span><span class="rv-arrow">&rarr;</span></a>' +
          '<a class="rv-share-btn" href="'+FACEBOOK_REVIEW_URL+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><span>Facebook</span><span class="rv-arrow">&rarr;</span></a>' +
          '<a class="rv-share-btn" href="'+ZILLOW_REVIEW_URL+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#006AFF"><path d="M12 2L1 11h3v11h7v-6h2v6h7V11h3L12 2zm0 2.69L18 9.6V20h-3v-6H9v6H6V9.6l6-4.91z"/></svg><span>Zillow</span><span class="rv-arrow">&rarr;</span></a>' +
        '</div>' +
      '</div>' +
      '<p style="color:var(--text-muted);font-size:0.75rem;margin-top:2rem">(828) 506-6413 | coryhelpsyoumove@gmail.com</p>' +
    '</div>';
  if (!document.getElementById('rvToast')) {
    var toast = document.createElement('div');
    toast.id = 'rvToast';
    toast.className = 'rv-toast';
    document.body.appendChild(toast);
  }
}

// Manual copy button (reviewer-initiated). No auto-copy on navigation.
function copyReview(){
  navigator.clipboard.writeText(_reviewText).then(function(){
    var btn = document.getElementById('rvCopyBtn');
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg> Copied!';
    showToast('Review copied to clipboard');
    setTimeout(function(){ btn.classList.remove('copied'); btn.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy my review'; }, 3000);
  });
}

function showToast(msg) {
  var t = document.getElementById('rvToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 4000);
}

init();
</script>
</body>
</html>
