<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM — Cory Helps You Move</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="crm.css?v=7">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Restore theme immediately to prevent flash
    (function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
</head>
<body>

<!-- Auth Gate -->
<div id="crmAuthGate">
  <div class="crm-spinner"></div>
</div>

<!-- Main CRM App -->
<div id="crmApp" style="display:none">
  <!-- Top Bar -->
  <header class="crm-topbar">
    <div class="crm-topbar-left">
      <span class="crm-logo fd">Cory CRM</span>
      <span class="crm-title">Dashboard</span>
    </div>
    <div class="crm-topbar-center">
      <div class="crm-global-search-wrap">
        <svg class="crm-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="crm-global-search" id="globalSearch" placeholder="Search contacts, transactions, docs..." autocomplete="off" />
        <span class="crm-search-hint">Ctrl+K</span>
        <div class="crm-search-results" id="globalSearchResults"></div>
      </div>
    </div>
    <div class="crm-topbar-right">
      <button class="crm-theme-toggle" id="themeToggle" title="Toggle theme">
        <span class="t-sun" style="display:none">&#9728;</span>
        <span class="t-moon">&#9789;</span>
      </button>
      <a href="/">Back to Site &rarr;</a>
    </div>
  </header>

  <!-- Layout: Sidebar + Main -->
  <div class="crm-layout">
    <nav class="crm-sidebar" id="crmSidebar"></nav>
    <main class="crm-main" id="crmMain">
      <div class="crm-loading"><div class="crm-spinner"></div></div>
    </main>
  </div>

  <!-- Quick-Add FAB -->
  <div class="crm-fab" id="crmFab" title="Quick add">+</div>
  <div class="crm-fab-menu" id="crmFabMenu"></div>
</div>

<!-- Toast Container -->
<div class="crm-toast-container" id="toastContainer"></div>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- Chart.js (CMA charts) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

<!-- jsPDF + AutoTable (CMA PDF export) -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8/dist/jspdf.plugin.autotable.min.js"></script>

<!-- CRM Logic -->
<script src="crm.js?v=7"></script>

</body>
</html>
